<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .cat {
      margin: 70px auto;
      width: 360px;
      height: 640px;
      background-image: url(./bk.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      position: relative;
      /* 作为视频绝对定位的父级 */
      background-color: #000;
      /* 可选：留白部分设为黑色，更美观 */
      overflow: hidden !important;
      /* 兜底：防止视频轻微偏移溢出 */
    }

    .cat video {
      position: absolute;
      /* 相对于 cat 定位 */
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* 铺满并裁切 */
      pointer-events: none;
      /* 避免阻挡鼠标点击 */
    }

    .btn {
      position: absolute;
      left: 0;
      bottom: 60px;
      width: 100%;
      display: flex;
      /* justify-content: space-between; */
      gap: 40px;
      z-index: 10;
    }

    /* 按钮基础样式 */
    .bt {
      width: 90px;
      height: 42px;
      background: linear-gradient(180deg, #fff3a0, #f4ef72);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      color: #5c5200;

      /* 立体感 */
      box-shadow:
        0 6px 0 #c9c24d,
        0 10px 18px rgba(0, 0, 0, 0.35);

      transition: all 0.15s ease;
    }

    /* 悬浮 */
    .bt:hover {
      filter: brightness(1.05);
    }

    /* 按下 */
    .bt:active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 #c9c24d,
        0 6px 12px rgba(0, 0, 0, 0.4);
    }

    /* 第二个按钮稍微换个色（区分左右） */
    .bt2 {
      background: linear-gradient(180deg, #c2f3ff, #7fd7ff);
      color: #03536b;
      box-shadow:
        0 6px 0 #4bb1d6,
        0 10px 18px rgba(0, 0, 0, 0.35);
    }

    .bt2:active {
      box-shadow:
        0 2px 0 #4bb1d6,
        0 6
    }

    .bt1 {
      margin-left: 62px;
    }

    .bt2 {
      margin-left: 48px;
    }
  </style>
</head>

<body>
  <div class="cat">
    <div class="btn">
      <button class="bt1 bt">选择</button>
      <button class="bt2 bt">选择</button>
    </div>
  </div>
  <script>
    /* ========= 资源路径 ========= */
    const ASSETS = {
      images: {
        bk: "url('./bk.jpg')",
        left: "url('./left.jpg')",
        right: "url('./right.jpg')",
      },
      video: './video.mp4',
      sounds: {
        bt1: './luobo.mp3',
        bt2: './good.mp3',
        start: './luobo.mp3'
      }
    };

    /* ========= DOM ========= */
    const bt1 = document.querySelector('.bt1');
    const bt2 = document.querySelector('.bt2');
    const cat = document.querySelector('.cat');

    /* ========= 图片预加载 ========= */
    function preloadImages() {
      Object.values(ASSETS.images).forEach(src => {
        const img = new Image();
        img.src = src.replace(/url\(['"]?(.*?)['"]?\)/, '$1');
      });
    }

    /* ========= 音频（统一管理 & 复用） ========= */
    function createAudio(src) {
      const audio = new Audio(src);
      audio.preload = 'auto';
      audio.load();
      return audio;
    }

    const sounds = {
      bt1: createAudio(ASSETS.sounds.bt1),
      bt2: createAudio(ASSETS.sounds.bt2),
      start: createAudio(ASSETS.sounds.start)
    };

    function playSound(audio) {
      audio.pause();
      audio.currentTime = 0;
      audio.play().catch(() => { });
    }

    /* ========= 视频（只创建一次，避免卡顿） ========= */
    const video = document.createElement('video');
    video.src = ASSETS.video;
    video.preload = 'auto';
    video.muted = true;
    video.playsInline = true;
    video.controls = false;
    video.style.opacity = '0';

    let videoReady = false;

    video.addEventListener('canplay', () => {
      videoReady = true;
    });

    function playVideoInCat() {
      if (!videoReady) return;

      video.style.opacity = '0';
      cat.style.backgroundImage = 'none';

      if (!cat.contains(video)) {
        cat.appendChild(video);
      }

      requestAnimationFrame(() => {
        video.currentTime = 0;
        video.play().catch(() => { });
        video.style.opacity = '1';
      });
    }

    /* ========= 按钮交互 ========= */
    bt1.addEventListener('mousedown', () => {
      playSound(sounds.bt1);
      cat.style.backgroundImage = ASSETS.images.left;
    });

    bt1.addEventListener('mouseup', () => {
      cat.style.backgroundImage = ASSETS.images.bk;
    });

    let videoTimer = null;

    bt2.addEventListener('click', () => {
      cat.style.backgroundImage = ASSETS.images.right;

      if (videoTimer) clearTimeout(videoTimer);
      videoTimer = setTimeout(() => {
        playSound(sounds.bt2);
        playVideoInCat();
      }, 500);
    });

    /* ========= 页面加载完成 ========= */
    window.addEventListener('load', () => {
      preloadImages();

      setTimeout(() => {
        playSound(sounds.start);
      }, 500);
    });
  </script>

</body>

</html>
